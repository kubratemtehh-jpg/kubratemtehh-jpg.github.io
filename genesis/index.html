<!doctype html>
<html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D0B18"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>خاستگاه حیات</title>
<style>
/* Layout: full-bleed abyssal canvas; slim goal bar on top, atom tray at the bottom, menu as a sheet. Single dark world by design. */
:root{
  --abyss:#0D0B18; --magma:#D35400; --magma-soft:#f08a3c; --phos:#F1C40F;
  --ink:#ECE6F5; --ink-dim:#a9a0c2; --panel:rgba(22,17,40,.84); --line:rgba(236,230,245,.14);
  --f-display:'Lalezar','Vazirmatn',Tahoma,system-ui,sans-serif;
  --f-body:'Vazirmatn',Tahoma,system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--abyss);color:var(--ink);overflow:hidden;font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;font-size:14px}
#hud>*{pointer-events:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
button{font-family:var(--f-body);font-size:14px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
button.primary{background:var(--magma);border-color:var(--magma);color:#fff;font-weight:700;padding:12px 28px;font-size:16px}

/* top goal bar */
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:560px;margin-inline:auto;display:grid;gap:8px}
#bar{display:flex;align-items:center;gap:10px;padding:8px 10px;overflow:hidden;position:relative}
.icon{width:42px;height:42px;padding:0;display:grid;place-items:center;flex:none;border-radius:12px;font-family:var(--f-mono);font-weight:600;font-size:16px}
.burger{display:grid;gap:4px}.burger i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
#goal{flex:1;min-width:0;display:grid;gap:1px;cursor:pointer}
#step{font-size:11px;color:var(--magma-soft);font-weight:500;letter-spacing:.02em}
.gl{display:flex;align-items:baseline;gap:8px;min-width:0}
#goalName{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
bdi.f{font-family:var(--f-mono);font-weight:600;color:var(--phos);font-size:14px;white-space:nowrap}
#prog{position:absolute;inset-inline:0;bottom:0;display:flex;gap:2px;height:3px}
#prog i{flex:1;background:rgba(236,230,245,.1)}
#prog i.done{background:var(--phos)}#prog i.cur{background:var(--magma-soft)}
#hintBox{padding:10px 14px;font-size:13.5px;line-height:1.75;color:var(--ink)}

/* atom tray */
.bd{width:66px;height:50px;padding:0;border-radius:25px;border:2px solid rgba(255,255,255,.25);font-family:var(--f-mono);font-weight:600;font-size:16px;touch-action:none}
.bd[data-aa=gly]{background:radial-gradient(circle at 35% 30%,#c9f5ec,#48C9B0 70%);color:#06241f}
.bd[data-aa=ala]{background:radial-gradient(circle at 35% 30%,#fde9c6,#F5B041 70%);color:#2b1a02}
.bd:active{transform:scale(.92)}
#idock{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 12px}
.ev{width:66px;height:66px;padding:0;border-radius:50%;display:grid;place-items:center;border:2px solid rgba(255,255,255,.22);touch-action:manipulation;transition:opacity .2s,transform .1s}
.ev.bolt{background:radial-gradient(circle at 35% 30%,#3d5fa8,#1a2550 75%);color:#e3eeff}
.ev.engulf{background:radial-gradient(circle at 35% 30%,#7a4fc4,#2a1650 75%);color:#e9dcff}
.ev.meteor{background:radial-gradient(circle at 35% 30%,#b8541c,#4a1c0a 75%);color:#ffd9a8}
.ev:active{transform:scale(.92)}
.ev.alert{animation:alertP 1s infinite}
@keyframes alertP{0%{box-shadow:0 0 0 0 rgba(150,230,90,.8)}70%{box-shadow:0 0 0 16px rgba(150,230,90,0)}100%{box-shadow:0 0 0 0 rgba(150,230,90,0)}}.ev:disabled{opacity:.35;cursor:default}
#chance{position:absolute;right:0;top:calc(100% + 8px);display:flex;gap:6px;padding:5px;border-radius:12px;direction:ltr}
#chance .die{width:30px;height:30px;padding:5px;gap:2px;border-radius:7px;margin:0;box-shadow:none}
#chance .coin{width:30px;height:30px;margin:0;font-size:9px;border-width:2px}
#chance .coin.flip{animation:flipS .9s cubic-bezier(.2,.7,.3,1)}
@keyframes flipS{50%{transform:rotateY(900deg) scale(1.25)}to{transform:rotateY(1800deg)}}
.ch.again{background:radial-gradient(circle at 35% 30%,#fff3c4,#d4a017 72%);border-color:#b8860b;color:#3a2a00;font:700 19px var(--f-mono)}
.ch:disabled{opacity:.45}
#bAlbum{width:30px;height:30px;padding:0;border-radius:7px;border:1px solid var(--line);background:rgba(236,230,245,.08);display:grid;place-items:center;position:relative;color:var(--ink)}
#bAlbum svg{width:15px;height:15px}
#bAlbum.new{color:var(--phos)}
#bAlbum.new::after{content:'';position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--phos);box-shadow:0 0 8px var(--phos)}
#album{background:rgba(13,11,24,.95)}
#album h2{font-size:clamp(30px,8vw,40px)}
#album .inner{max-height:calc(100% - 24px);overflow:auto;padding-block:8px}
#album .orb{width:44px;height:44px}
#albumGrid{display:grid;gap:16px;width:100%}
.arow{display:grid;gap:8px;justify-items:center}
.arow>span{font-size:13px;color:var(--ink-dim)}
.arow>div{display:flex;gap:16px}
.orb{width:54px;height:54px;border-radius:50%;display:grid;place-items:end center;font-style:normal;background:radial-gradient(circle at 35% 30%,var(--h),var(--c) 70%);box-shadow:0 0 18px var(--c)}
.orb b{font:600 11px var(--f-mono);color:#0D0B18;background:rgba(255,255,255,.8);border-radius:8px;padding:0 6px;transform:translateY(7px)}
.orb.off{background:rgba(236,230,245,.05);border:1px dashed rgba(236,230,245,.25);box-shadow:none;place-items:center;color:var(--ink-dim);font-size:18px}
.ch{width:64px;height:64px;padding:0;border-radius:50%;font-size:28px;font-weight:700;color:#fff;border:2px solid rgba(255,255,255,.3)}
.ch.keep{background:#2e8b57}.ch.drop{background:#8e3b3b}
@keyframes pulse{70%{box-shadow:0 0 0 14px rgba(241,196,15,0)}100%{box-shadow:0 0 0 0 rgba(241,196,15,0)}}
.pip5{display:grid;grid-template-columns:repeat(3,10px);grid-template-rows:repeat(3,10px);gap:4px}
.pip5 i{width:10px;height:10px;border-radius:50%;background:#1b1530}
.pip5 i:nth-child(1){grid-area:1/1}.pip5 i:nth-child(2){grid-area:1/3}.pip5 i:nth-child(3){grid-area:2/2}.pip5 i:nth-child(4){grid-area:3/1}.pip5 i:nth-child(5){grid-area:3/3}
#badge{position:absolute;top:-8px;inset-inline-end:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--magma);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;box-sizing:border-box}
#sheet{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);max-width:460px;margin-inline:auto;max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 190px);overflow:auto;padding:16px 18px 18px;box-sizing:border-box;background:rgba(18,14,34,.97);display:grid;gap:10px}
#sheet h3{font-family:var(--f-display);font-weight:400;font-size:23px;margin:0;padding-inline-end:44px;line-height:1.25;text-wrap:balance}
#sheet h4{margin:6px 0 0;font-size:12px;font-weight:500;color:var(--magma-soft)}
#sheet p{margin:0;line-height:1.85;color:var(--ink-dim);font-size:14px}
#sheet p.res{color:var(--ink)}
#sheet .x{position:absolute;top:10px;inset-inline-end:10px;width:36px;height:36px}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-dim)}
.chip.good{color:#7ee2a8;border-color:rgba(126,226,168,.45)}.chip.bad{color:#f1948a;border-color:rgba(241,148,138,.45)}.chip.feat{color:var(--phos);border-color:rgba(241,196,15,.5)}
.opts{display:grid;gap:8px}
.opts button{border-radius:12px;text-align:start;display:grid;gap:3px;padding:10px 14px}
.opts button span{font-size:12px;color:var(--ink-dim)}
.die{width:72px;height:72px;border-radius:16px;background:#f3eee6;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11px;box-sizing:border-box;gap:5px;margin:4px auto;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.die i{border-radius:50%}.die i.on{background:#1b1530}
.die.roll{animation:shake .13s infinite}
@keyframes shake{0%{transform:rotate(-10deg) scale(.95)}50%{transform:rotate(10deg) scale(1.05)}100%{transform:rotate(-10deg) scale(.95)}}
.coin{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#d4a017 72%);border:3px solid #b8860b;display:grid;place-items:center;color:#3a2a00;font-weight:700;font-size:15px;margin:4px auto}
.coin.heads{background:radial-gradient(circle at 35% 30%,#fff3c4,#d4a017 72%)}.coin.tails{background:radial-gradient(circle at 35% 30%,#eef1f4,#9aa7b4 72%);border-color:#6f7c88;color:#1d252c}
.coin.flip{animation:flip .9s cubic-bezier(.2,.7,.3,1)}
@keyframes flip{from{transform:rotateY(0) translateY(0)}50%{transform:rotateY(900deg) translateY(-26px)}to{transform:rotateY(1800deg) translateY(0)}}
.hold{position:relative;overflow:hidden;touch-action:none}.hold .fill{position:absolute;inset:0;background:rgba(255,255,255,.3);transform:scaleX(0);transform-origin:left}
[dir=rtl] .hold .fill{transform-origin:right}.hold .lbl{position:relative}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13.5px}.kv dt{color:var(--ink-dim)}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.bars{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bars li{display:grid;grid-template-columns:7.5em 1fr 2ch;gap:10px;align-items:center;font-size:13.5px}
.bar{height:8px;border-radius:4px;background:rgba(236,230,245,.1);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--magma),var(--phos));border-radius:4px}
.log,.sum{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.log li{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.6}
.log li small{color:var(--ink-dim);font-size:11.5px}
.log li.keep span,.log li.mile span{color:var(--phos)}.log li.silent span,.log li.drift span{color:var(--ink-dim)}
.sum li{font-size:14px;line-height:1.8;color:var(--ink)}.sum li.notif{color:var(--ink-dim);font-size:13px}
.sum li.notif small{font-family:var(--f-mono);color:var(--magma-soft);margin-inline-end:6px}
#tray{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);left:50%;transform:translateX(-50%);display:flex;gap:12px;padding:8px 12px;direction:ltr}
.el{width:54px;height:54px;padding:0;border-radius:50%;border:2px solid rgba(255,255,255,.25);display:grid;place-items:center;position:relative;touch-action:none;font-family:var(--f-mono)}
.el b{font-size:20px;font-weight:600}
.el small{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--abyss);border:1px solid var(--line);font-size:10.5px;display:grid;place-items:center;color:var(--phos)}
.el[data-el=C]{background:radial-gradient(circle at 35% 30%,#9fb3c6,#2C3E50 70%);color:#eef3f7}
.el[data-el=H]{background:radial-gradient(circle at 35% 30%,#f2f9fe,#AED6F1 70%);color:#0D0B18}
.el[data-el=N]{background:radial-gradient(circle at 35% 30%,#b5dbf6,#3498DB 70%);color:#06121e}
.el[data-el=O]{background:radial-gradient(circle at 35% 30%,#fbb8b0,#E74C3C 70%);color:#2a0604}
.el:active{transform:scale(.92)}

#toast{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;padding:9px 16px;font-size:13.5px;line-height:1.7;text-align:center;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}

/* menu sheet */
#menu{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;max-width:420px;margin-inline:auto;max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 20px);overflow:auto;padding:14px 16px 18px;box-sizing:border-box;display:grid;gap:16px;background:rgba(18,14,34,.96)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:12px}
#menu h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
#menu h3{font-size:12px;font-weight:500;color:var(--magma-soft);margin:0 0 8px;letter-spacing:.03em}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:3px;width:max-content}
.seg button{border:0;padding:7px 16px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--abyss);font-weight:700}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px}
#collList{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto 2.5ch;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line)}
.row .n{font-variant-numeric:tabular-nums;color:var(--ink-dim);text-align:end}
.empty{color:var(--ink-dim);font-size:13px}
#helpList{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:1.6}
#helpList dt{color:var(--phos);font-weight:500}#helpList dd{margin:0;color:var(--ink-dim)}
#reset{font-size:12.5px;justify-self:start;color:var(--ink-dim)}

.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 100%,rgba(211,84,0,.24),rgba(13,11,24,.94) 62%)}
.overlay .inner{max-width:30rem;text-align:center;display:grid;gap:16px;justify-items:center}
.overlay h2{font-family:var(--f-display);font-weight:400;font-size:clamp(42px,11vw,66px);margin:0;line-height:1.05}
.overlay .sub{font-family:var(--f-mono);font-size:11.5px;color:var(--magma-soft);letter-spacing:.08em}
.overlay p{margin:0;line-height:1.95;color:var(--ink-dim);font-size:15px;text-wrap:pretty}
@media (max-width:380px){.el{width:48px;height:48px}#tray{gap:9px}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.el:active{transform:none}}
</style>

<canvas id="c"></canvas>
<div id="hud" dir="rtl">
  <div id="top">
    <div id="bar" class="card">
      <button class="icon" id="bMenu" type="button" aria-label="Menu"><span class="burger"><i></i><i></i><i></i></span></button>
      <div id="goal" role="button" tabindex="0">
        <span id="step"></span>
        <span class="gl"><span id="goalName"></span><bdi class="f" dir="ltr" id="goalF"></bdi></span>
      </div>
      <button class="icon" id="bHint" type="button" aria-expanded="false">?</button>
      <div id="prog"></div>
    </div>
    <div id="hintBox" class="card" hidden></div>
    <div id="chance" class="card" hidden><button id="bAlbum" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="7" cy="7" r="3.2"/><circle cx="17" cy="7" r="3.2"/><circle cx="7" cy="17" r="3.2"/><circle cx="17" cy="17" r="3.2" opacity=".4"/></svg></button><span class="die" id="die"></span><span class="coin" id="coin">?</span></div>
  </div>

  <div id="tray" class="card">
    <button class="el" data-el="C" type="button"><b>C</b><small>4</small></button>
    <button class="el" data-el="H" type="button"><b>H</b><small>1</small></button>
    <button class="el" data-el="N" type="button"><b>N</b><small>3</small></button>
    <button class="el" data-el="O" type="button"><b>O</b><small>2</small></button>
  </div>
  <div id="idock" class="card" hidden>
    <button id="bBolt" class="ev bolt" type="button"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M13.5 2 4.5 13.5h6.5L9.5 22l9-12h-6.5z" fill="currentColor"/></svg></button>
    <button id="bMeteor" class="ev meteor" type="button"><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><path d="M2.5 4.5l9 6.5M5 2l8.5 8.5M2 8l8.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".55" fill="none"/><circle cx="15.5" cy="15.5" r="6" fill="currentColor"/><circle cx="13.6" cy="14" r="1.4" fill="#2a1408" opacity=".45"/><circle cx="17.4" cy="17.4" r="1" fill="#2a1408" opacity=".45"/></svg></button>
    <button id="bEngulf" class="ev engulf" type="button" hidden><svg viewBox="0 0 24 24" width="32" height="32" aria-hidden="true"><circle cx="14" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="14" cy="12" r="2.2" fill="currentColor" opacity=".5"/><rect x="1.5" y="9.6" width="9.5" height="4.8" rx="2.4" fill="currentColor"/></svg></button>
    <button id="bKeep" class="ch keep" type="button" aria-label="Keep" hidden>✓</button>
    <button id="bAgain" class="ch again" type="button" dir="ltr" hidden><span>×2</span></button>
    <button id="bDrop" class="ch drop" type="button" aria-label="Remove" hidden>✕</button>
  </div>
  <div id="toast" class="card" role="status"></div>

  <aside id="menu" class="card" hidden>
    <div class="mh"><h2 data-i="menu"></h2><button class="icon" id="bClose" type="button" aria-label="Close">✕</button></div>
    <section><h3 data-i="episodes"></h3>
      <div class="seg"><button type="button" data-ep="1" data-i="ep1"></button><button type="button" data-ep="2" data-i="ep2"></button></div>
    </section>
    <section><h3 data-i="lang"></h3>
      <div class="seg" dir="ltr"><button type="button" data-lang="fa">فارسی</button><button type="button" data-lang="en">English</button></div>
    </section>
    <section class="opt"><h3 data-i="sound" style="margin:0"></h3><button id="bSound" type="button"></button></section>
    <section><h3 data-i="coll"></h3><ul id="collList"></ul></section>
    <section><h3 data-i="help"></h3><dl id="helpList"></dl></section>
    <button id="reset" type="button"></button>
  </aside>

  <div id="intro" class="overlay">
    <div class="inner">
      <div class="seg" dir="ltr"><button type="button" data-lang="fa">فارسی</button><button type="button" data-lang="en">English</button></div>
      <div class="sub" dir="ltr">GENESIS · THE PRIMORDIAL DAWN</div>
      <h2 data-i="introTitle"></h2>
      <p data-i="introText"></p>
      <button class="primary" id="bStart" type="button" data-i="start"></button>
    </div>
  </div>
  <div id="finale" class="overlay" hidden>
    <div class="inner">
      <div class="sub" dir="ltr">EPISODE 1 COMPLETE</div>
      <h2 data-i="finTitle"></h2>
      <p data-i="finText"></p>
      <button class="primary" id="bGo2" type="button" data-i="go2"></button>
      <button id="bFree" type="button" data-i="cont"></button>
    </div>
  </div>
  <div id="album" class="overlay" hidden>
    <div class="inner">
      <h2 data-i="album"></h2>
      <div class="sub" id="albumCount"></div>
      <div id="albumGrid"></div>
      <button class="primary" id="bAlbumClose" type="button" data-i="albumClose"></button>
    </div>
  </div>
  <div id="ep2card" class="overlay" hidden>
    <div class="inner">
      <div class="sub" dir="ltr">LIVING EVOLUTION</div>
      <h2 data-i="ep2Title"></h2>
      <p data-i="ep2Text"></p>
      <button class="primary" id="bStart2" type="button" data-i="start"></button>
    </div>
  </div>
</div>
</div>

<script>
try{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap';document.head.appendChild(l)}catch(e){}
(()=>{
'use strict';

function recompute(){
  const p=new Map();atoms.forEach(a=>{a.used=0;a.nb=[];p.set(a.id,a.id)});
  const f=x=>{while(p.get(x)!==x){p.set(x,p.get(p.get(x)));x=p.get(x)}return x};
  bonds.forEach(k=>{k.a.used+=k.order;k.b.used+=k.order;k.a.nb.push(k.b);k.b.nb.push(k.a);p.set(f(k.a.id),f(k.b.id))});
  mols=new Map();atoms.forEach(a=>{a.mol=f(a.id);if(!mols.has(a.mol))mols.set(a.mol,[]);mols.get(a.mol).push(a)});
}

function identify(list,opt={}){
  if(list.some(a=>free(a)>0)){untag(list);return null}
  const c={C:0,H:0,N:0,O:0};list.forEach(a=>c[a.el]++);
  const key=[c.C,c.H,c.N,c.O].join(',');
  let e=CAT[key];
  if(e&&e.check&&!e.check(list))e=e.alt||E(e.id+'-iso','ایزومرِ '+e.name.fa,e.name.en+' isomer',e.disp);
  if(!e){const d=['C','H','N','O'].filter(k=>c[k]).map(k=>k+(c[k]>1?sub(c[k]):'')).join('');e=E('x'+key,'مولکول پایدار','Stable molecule',d)}
  const was=list.every(a=>a.tag&&a.tag.id===e.id);
  list.forEach(a=>{a.tag=e;a.amb=!!opt.amb});
  if(!opt.silent&&!was)collect(e,list);
  return e;
}

let AC=null,master=null;
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=save.sound?.8:0;master.connect(AC.destination);
    const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=140;
    const g=AC.createGain();g.gain.value=.32;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.07;lg.gain.value=.12;lfo.connect(lg);lg.connect(g.gain);lfo.start();
    src.connect(lp);lp.connect(g);g.connect(master);src.start();
  }catch(e){AC=null}
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.7);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0005,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}

const curTask=()=>TASKS.find(t=>!save.done[t.id]);

function applyLang(){

function collect(e,list){
  const r=save.coll[e.id]||(save.coll[e.id]={name:e.name,disp:e.disp,n:0});r.n++;
  list.forEach(a=>a.glow=90);sfxChord(!!e.amino);buzz(e.amino?[20,40,20]:15);

/* ---------- interactions ---------- */
function bondAt(a,b){
  untag(molOf(a));untag(molOf(b));bonds.push({a,b,order:1});recompute();
  molOf(a).forEach(x=>x.user=true);
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;burst(mx,my,14,'#f39c3c');arc(mx,my);sfxBond();buzz(10);
  identify(molOf(a));
}
function cycleBond(k){
  const before=molOf(k.a);
  if(free(k.a)>0&&free(k.b)>0&&k.order<3){k.order++;sfxOrder();buzz(8)}
  else if(k.order>1){k.order=1;sfxBreak()}
  else{toast(S('needFree'),2600);return}
  untag(before);recompute();burst((k.a.x+k.b.x)/2,(k.a.y+k.b.y)/2,8,'#F1C40F');identify(molOf(k.a));
}
function breakAtom(a){
  const nb=a.nb.slice();if(!nb.length)return;
  untag(molOf(a));bonds=bonds.filter(k=>k.a!==a&&k.b!==a);recompute();
  sfxBreak();buzz(25);burst(a.x,a.y,12,'#AED6F1');
  nb.forEach(b=>{a.vx+=(a.x-b.x)*.06;a.vy+=(a.y-b.y)*.06;identify(molOf(b),{silent:true})});
}
const ptr=e=>({x:e.clientX,y:e.clientY});
function pickAtom(p,pad){let best=null,bd=1e9;for(const a of atoms){if(reacting.has(a))continue;const d=Math.hypot(a.x-p.x,a.y-p.y);if(d<R[a.el]+pad&&d<bd){bd=d;best=a}}return best?{a:best,d:bd}:null}
function pickBond(p,rad){let best=null,bd=rad;for(const k of bonds){if(reacting.has(k.a))continue;const d=Math.hypot((k.a.x+k.b.x)/2-p.x,(k.a.y+k.b.y)/2-p.y);if(d<bd){bd=d;best=k}}return best?{k:best,d:bd}:null}
function startDrag(a,p,e,fromTray){
  const touch=e.pointerType!=='mouse';
  drag={atom:a,px:p.x,py:p.y,sx:p.x,sy:p.y,t:performance.now(),moved:false,touch,pid:e.pointerId,tray:fromTray,lp:0};
  if(fromTray)a.user=true;
  if(!fromTray&&a.nb.length)drag.lp=setTimeout(()=>{if(drag&&!drag.moved&&drag.atom===a){breakAtom(a);drag=null;snapPair=null}},520);
}
cv.addEventListener('pointerdown',e=>{
  ensureAudio();closeMenu();
  if(ep===2){idleDown(e);return}
  const touch=e.pointerType!=='mouse',p=ptr(e);
  const ha=pickAtom(p,touch?20:10),hb=pickBond(p,touch?26:16);
  if(hb&&(!ha||hb.d<ha.d-4)){cycleBond(hb.k);return}
  if(ha)startDrag(ha.a,p,e,false);
});
addEventListener('pointermove',e=>{
  if(ep===2)return;
  if(!drag||e.pointerId!==drag.pid)return;const p=ptr(e);drag.px=p.x;drag.py=p.y;
  if(!drag.moved&&Math.hypot(p.x-drag.sx,p.y-drag.sy)>9){drag.moved=true;clearTimeout(drag.lp)}
});
function endDrag(e){
  if(ep===2)return;
  if(!drag||(e&&e.pointerId!==drag.pid))return;clearTimeout(drag.lp);
  const a=drag.atom,now=performance.now();
  if(drag.tray&&!drag.moved){ // tap on tray: drop into open water
    a.x=W/2+(Math.random()-.5)*Math.min(W*.6,360);a.y=resB+(botB-resB)*(.2+Math.random()*.3);a.vx=a.vy=0;burst(a.x,a.y,10,RIM[a.el]);
  }else if(drag.tray&&a.y>botB-R[a.el]){a.y=botB-R[a.el]-8}
  else if(!drag.moved&&now-drag.t<300){
    if(lastTap&&lastTap.a===a&&now-lastTap.t<380){breakAtom(a);lastTap=null}
    else{lastTap={a,t:now};const f=free(a);toast(`${ELN[a.el][save.lang]} (${a.el}) · ${f?S('slots')(num(f)):S('full')}`,1600)}
  }
  if(!reacting.has(a)){
    const m=molOf(a),wasUser=a.user,inRes=centroid(m).y<resB;
    m.forEach(x=>{x.user=!inRes;x.glow=0});
    if(drag.moved&&inRes&&wasUser)toast(S('parked'),1600);
    if(drag.moved&&!inRes&&!wasUser)burst(a.x,a.y,8,'#AED6F1');
  }
  drag=null;snapPair=null;
}
addEventListener('pointerup',endDrag);addEventListener('pointercancel',endDrag);

document.querySelectorAll('.el').forEach(b=>b.addEventListener('pointerdown',e=>{
  e.preventDefault();ensureAudio();closeMenu();
  const el=b.dataset.el,p=ptr(e);trimLone(el);
  const a=addAtom(el,p.x,p.y-30);recompute();sfxSpawn();buzz(6);startDrag(a,p,e,true);
}));
function trimLone(el){
  const k=area(),cap=Math.round(70*k)+24;if(atoms.length<cap)return;
  let worst=null,wd=-1;const c={x:W/2,y:(topB+botB)/2};
  for(const a of atoms){if(a.nb.length||a.user||reacting.has(a))continue;const d=Math.hypot(a.x-c.x,a.y-c.y);if(d>wd){wd=d;worst=a}}
  if(worst)atoms=atoms.filter(a=>a!==worst),recompute();
}

/* ---------- effects ---------- */
function burst(x,y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1+Math.random()*3;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*20,col})}}
function arc(x,y){const v=vent(),pts=[],n=10;for(let i=0;i<=n;i++){const t=i/n,j=i&&i<n;pts.push([v.x+(x-v.x)*t+(j?(Math.random()-.5)*40:0),v.y+(y-v.y)*t+(j?(Math.random()-.5)*20:0)])}arcs.push({pts,life:14})}

/* ---------- spawning ---------- */
const area=()=>Math.max(.42,Math.min(1,(W*H)/(1200*800)));
function emitAtom(el){const v=vent();addAtom(el,v.x+(Math.random()-.5)*50,v.y-10,(Math.random()-.5)*2,-3-Math.random()*2);recompute()}
function emitMol(name){const v=vent();spawnTpl(T[name],v.x+(Math.random()-.5)*70,v.y-50,(Math.random()-.5)*2,-2.5,{silent:true,amb:true})}
function populate(){
  const k=area(),rx=()=>40+Math.random()*(W-80),ry=()=>topB+14+Math.random()*Math.max(10,resB-topB-28);
  const n={H:Math.round(5*k)+2,C:Math.round(2*k)+1,O:Math.round(2*k)+1,N:1};
  for(const el in n)for(let i=0;i<n[el];i++)addAtom(el,rx(),ry());
  recompute();
  (small?['water','water','ammonia','methane']:['water','water','water','ammonia','ammonia','methane','co2']).forEach(m=>spawnTpl(T[m],rx(),ry(),0,0,{silent:true,amb:true}));
  ['glycine','alanine'].forEach(id=>{const c=Math.min(small?2:3,(save.coll[id]||{n:0}).n);for(let i=0;i<c;i++)spawnTpl(T[id],rx(),ry(),0,0,{silent:true})});
}
function maintain(){
  if(frame%40)return;
  const k=area();if(atoms.length>Math.round(70*k)+20)return;
  const lone={H:0,C:0,N:0,O:0},amb={water:0,ammonia:0,methane:0,co2:0};
  atoms.forEach(a=>{if(!a.nb.length)lone[a.el]++});
  for(const l of mols.values()){const t=l[0].tag;if(t&&amb[t.id]!==undefined)amb[t.id]++}
  const need={H:Math.round(5*k)+1,C:1,O:1,N:1};
  for(const el of ['C','N','O','H'])if(lone[el]<need[el])return emitAtom(el);
  if(amb.water<2)return emitMol('water');
  if(amb.ammonia<1+(small?0:1))return emitMol('ammonia');
  if(!small&&amb.methane<1)return emitMol('methane');
  if(!small&&amb.co2<1)return emitMol('co2');
}

/* ---------- reaction (Strecker) ---------- */
function centroid(l){let x=0,y=0;l.forEach(a=>{x+=a.x;y+=a.y});return{x:x/l.length,y:y/l.length}}
function checkReaction(){
  if(reaction||frame%10)return;
  const z=zone();let ald=null,hcn=null;
  for(const l of mols.values()){
    const t=l[0].tag;if(!t||(drag&&l.includes(drag.atom)))continue;
    const c=centroid(l);if(Math.hypot(c.x-z.x,c.y-z.y)>z.r)continue;
    if(!ald&&(t.id==='formaldehyde'||t.id==='acetaldehyde'))ald=l;
    if(!hcn&&t.id==='hcn')hcn=l;
  }
  if(!ald||!hcn)return;
  const near=id=>{let b=null,bd=1e9;for(const l of mols.values()){if(l[0].tag&&l[0].tag.id===id&&!l.some(a=>reacting.has(a))){const c=centroid(l),d=Math.hypot(c.x-z.x,c.y-z.y);if(d<bd){bd=d;b=l}}}return b};
  const water=near('water'),amm=near('ammonia');
  reaction={ald,hcn,water,amm,t:0,product:ald[0].tag.id==='formaldehyde'?'glycine':'alanine'};
  [ald,hcn,water,amm].forEach(l=>l&&l.forEach(a=>reacting.add(a)));
  toast(S('strecker')[reaction.product],4200);tone('sine',80,320,1.6,.18);
}
function stepReaction(){
  if(!reaction)return;const z=zone(),r=reaction;r.t++;
  reacting.forEach(a=>{a.vx+=(z.x-a.x)*.012;a.vy+=(z.y-a.y)*.012;a.glow=Math.max(a.glow,20)});
  if(r.t%6===0)arc(z.x+(Math.random()-.5)*60,z.y+(Math.random()-.5)*60);
  if(r.t<110)return;
  const gone=new Set([...r.ald,...r.hcn,...(r.water||[])]);
  atoms=atoms.filter(a=>!gone.has(a));bonds=bonds.filter(k=>!gone.has(k.a)&&!gone.has(k.b));
  if(r.amm)r.amm.forEach(a=>{a.vx+=(a.x-z.x)*.08;a.vy-=2});
  reacting.clear();recompute();
  flashes.push({x:z.x,y:z.y,life:50});burst(z.x,z.y,40,'#F1C40F');
  spawnTpl(T[r.product],z.x,z.y,0,-3.5).forEach(a=>a.user=false);reaction=null;
}

/* ---------- physics ---------- */
function step(){
  frame++;snapPair=null;
  if(ep===2){stepIdle();fx();return}
  if(drag){
    const a=drag.atom,lift=drag.touch&&(drag.moved||drag.tray)?48:0;
    a.x+=(drag.px-a.x)*.38;a.y+=(drag.py-lift-a.y)*.38;a.vx*=.4;a.vy*=.4;
    const SN=drag.touch?125:95;let best=null,bd=1e9;
    for(const x of molOf(a)){if(free(x)<1)continue;
      for(const y of atoms){if(y.mol===a.mol||!y.user||free(y)<1||reacting.has(y))continue;
        const d=Math.hypot(x.x-y.x,x.y-y.y);if(d<SN&&d<bd){bd=d;best=[x,y]}}}
    if(best){const[x,y]=best,f=.6*(1-bd/SN)+.14;y.vx+=(x.x-y.x)/bd*f;y.vy+=(x.y-y.y)/bd*f;snapPair=best;
      if(bd<(R[x.el]+R[y.el])*1.2+6)bondAt(x,y)}
  }
  const n=atoms.length;
  for(const a of atoms){if(drag&&a===drag.atom)continue;const j=a.user?.06:.14;a.vx+=(Math.random()-.5)*j;a.vy+=(Math.random()-.5)*j}
  for(const k of bonds){const a=k.a,b=k.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01,rest=(R[a.el]+R[b.el])*1.3,f=(d-rest)*.12;
    a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  const rep=R.C*4;
  for(let i=0;i<n;i++){const a=atoms[i];for(let j=i+1;j<n;j++){const b=atoms[j],dx=b.x-a.x,dy=b.y-a.y;
    if(dx>100||dx<-100||dy>100||dy<-100)continue;const d=Math.hypot(dx,dy)||.01;let f=0;
    if(a.mol===b.mol){if(!a.nb.includes(b)&&d<rep)f=(rep-d)*.02}
    else{const m=R[a.el]+R[b.el]+6;if(d<m)f=(m-d)*.08}
    if(f){a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f}}}
  const dm=drag?new Set(molOf(drag.atom)):null;
  for(const a of atoms){
    const r=R[a.el]+4,dragged=dm&&dm.has(a);
    if(!dragged&&!reacting.has(a)){
      if(a.user){if(a.y<resB+r)a.vy+=.5}            // in play: kept below the reserve
      else if(a.glow<=0&&a.y>resB-r)a.vy-=.45;       // parked: floats up into the reserve
    }
    a.vx*=.88;a.vy*=.88;const s=Math.hypot(a.vx,a.vy);if(s>7){a.vx*=7/s;a.vy*=7/s}
    a.x+=a.vx;a.y+=a.vy;
    if(a.x<r){a.x=r;a.vx=Math.abs(a.vx)*.5}if(a.x>W-r){a.x=W-r;a.vx=-Math.abs(a.vx)*.5}
    if(a.y<topB+r){a.y=topB+r;a.vy=Math.abs(a.vy)*.5}
    if(!dragged&&a.y>botB-r){a.y=botB-r;a.vy=-Math.abs(a.vy)*.5}
    if(a.glow>0)a.glow--;
  }
  checkReaction();stepReaction();maintain();
  fx();
}
function fx(){
  const v=vent();
  if(!reduce&&Math.random()<(small?.1:.18))bubbles.push({x:v.x+(Math.random()-.5)*40,y:v.y,r:1.5+Math.random()*4,vy:-.6-Math.random()*1.2,w:Math.random()*6.28});
  if(Math.random()<.45)plume.push({x:v.x+(Math.random()-.5)*26,y:v.y,vy:-.8-Math.random()*.8,vx:(Math.random()-.5)*.4,life:120});
  bubbles.forEach(b=>{b.y+=b.vy;b.w+=.05;b.x+=Math.sin(b.w)*.3});
  bubbles=bubbles.filter(b=>{if(b.y<-10){if(AC&&Math.random()<.04)sfxPop();return false}return true});
  plume.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life--});plume=plume.filter(p=>p.life>0);
  if(!reduce)snow.forEach(s=>{s.y+=s.v;s.x+=Math.sin((frame+s.p)*.01)*.15;if(s.y>H)s.y=-4});
  sparks.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.93;p.vy*=.93;p.life--});sparks=sparks.filter(p=>p.life>0);
  arcs.forEach(a=>a.life--);arcs=arcs.filter(a=>a.life>0);
  flashes.forEach(f=>f.life--);flashes=flashes.filter(f=>f.life>0);
}

/* ---------- render ---------- */
function buildScene(){
  mainH=small?50:64;
  rocks=[{x:W/2,w:Math.min(150,W*.34),h:mainH,main:true},{x:W*.1,w:small?56:76,h:mainH*.55},{x:W*.9,w:small?64:92,h:mainH*.7}];
  snow=Array.from({length:small?28:55},()=>({x:Math.random()*W,y:Math.random()*H,v:.08+Math.random()*.25,r:Math.random()*1.3+.3,p:Math.random()*1000,a:.08+Math.random()*.18}));
}
function drawRock(r){
  const top=botB-r.h;ctx.beginPath();ctx.moveTo(r.x-r.w/2,H);ctx.lineTo(r.x-r.w*.42,botB);
  ctx.lineTo(r.x-r.w*.24,top+r.h*.3);ctx.lineTo(r.x-r.w*.12,top);ctx.lineTo(r.x+r.w*.1,top+2);
  ctx.lineTo(r.x+r.w*.26,top+r.h*.4);ctx.lineTo(r.x+r.w*.42,botB);ctx.lineTo(r.x+r.w/2,H);ctx.closePath();ctx.fill();
}
function render(){
  const t=frame;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0a0814');g.addColorStop(.55,'#120d22');g.addColorStop(1,'#26111b');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const v=vent(),fl=.86+Math.sin(t*.05)*.07+Math.random()*.05;
  // light column above vent
  const bm=ctx.createLinearGradient(0,v.y,0,v.y-H*.6);bm.addColorStop(0,`rgba(211,84,0,${.16*fl})`);bm.addColorStop(1,'rgba(211,84,0,0)');
  ctx.fillStyle=bm;ctx.beginPath();ctx.moveTo(v.x-24,v.y);ctx.lineTo(v.x-W*.22,v.y-H*.6);ctx.lineTo(v.x+W*.22,v.y-H*.6);ctx.lineTo(v.x+24,v.y);ctx.fill();
  const rg=ctx.createRadialGradient(v.x,v.y,8,v.x,v.y,Math.max(240,W*.4));
  rg.addColorStop(0,`rgba(230,100,20,${.5*fl})`);rg.addColorStop(.35,'rgba(160,50,20,.12)');rg.addColorStop(1,'rgba(13,11,24,0)');
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#d9cfee';snow.forEach(s=>{ctx.globalAlpha=s.a;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill()});ctx.globalAlpha=1;
  if(!reduce&&Math.random()<.004)flashes.push({x:Math.random()*W,y:topB+Math.random()*H*.5,life:24,soft:true});
  flashes.forEach(f=>{const a=f.life/(f.soft?24:50),Rr=f.soft?90:220,fg=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,Rr);
    fg.addColorStop(0,f.soft?`rgba(120,170,255,${.12*a})`:`rgba(241,196,15,${.35*a})`);fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.fillRect(f.x-Rr,f.y-Rr,Rr*2,Rr*2)});
  plume.forEach(p=>{ctx.fillStyle=`rgba(240,138,60,${p.life/120*.28})`;ctx.beginPath();ctx.arc(p.x,p.y,1.7,0,6.28);ctx.fill()});
  ctx.strokeStyle='rgba(174,214,241,.3)';ctx.lineWidth=1;bubbles.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,6.28);ctx.stroke()});
  ctx.fillStyle='#060409';rocks.forEach(drawRock);
  ctx.fillStyle=`rgba(255,130,40,${.85*fl})`;ctx.beginPath();ctx.ellipse(v.x-4,v.y-4,11,4,0,0,6.28);ctx.fill();

    ctx.translate(cx,cy+R*.9);ctx.scale(sc,sc);ctx.font=`700 ${30+pend.mult*5}px "IBM Plex Mono",monospace`;ctx.lineWidth=6;ctx.strokeStyle='rgba(13,11,24,.8)';ctx.direction='ltr';
    ctx.strokeText('×'+num(pend.mult),0,0);ctx.fillStyle='#F1C40F';ctx.fillText('×'+num(pend.mult),0,0);ctx.restore()}
  for(const q of pops){ctx.save();ctx.globalAlpha=Math.min(1,q.life/25);ctx.textAlign='center';ctx.textBaseline='middle';ctx.direction=save.lang==='fa'&&!/^[×★]/.test(q.txt)?'rtl':'ltr';
    const sc=q.life>60?1+(q.life-60)*.06:1;ctx.translate(q.x,q.y);ctx.scale(sc,sc);ctx.font=`700 ${q.size}px Vazirmatn,"IBM Plex Mono",system-ui`;ctx.lineWidth=6;ctx.strokeStyle='rgba(13,11,24,.75)';ctx.strokeText(q.txt,0,0);ctx.fillStyle=q.col;ctx.fillText(q.txt,0,0);ctx.restore()}
  if(strike){const k=strike;ctx.save();
    if(k.kind==='bolt'){const a=(1-k.t/k.dur)*(.65+Math.random()*.35);ctx.lineJoin='round';ctx.lineCap='round';
      ctx.beginPath();k.pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.strokeStyle=`rgba(150,195,255,${a*.45})`;ctx.lineWidth=10;ctx.stroke();ctx.strokeStyle=`rgba(248,251,255,${a})`;ctx.lineWidth=2.6;ctx.stroke();
      const g=ctx.createRadialGradient(k.tx,k.ty,0,k.tx,k.ty,170);g.addColorStop(0,`rgba(205,228,255,${a*.5})`);g.addColorStop(1,'rgba(205,228,255,0)');ctx.fillStyle=g;ctx.fillRect(k.tx-170,k.ty-170,340,340);
      if(k.t<4&&!reduce){ctx.fillStyle=`rgba(220,235,255,${.22-k.t*.05})`;ctx.fillRect(0,0,W,H)}}
    else if(k.kind==='engulf'){const q=k.t/k.dur;ctx.strokeStyle=`rgba(200,170,255,${1-q})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(k.tx,k.ty,10+q*R*.3,0,6.28);ctx.stroke()}
    else if(k.t<30){const q=k.t/30,e=q*q,x=k.sx+(k.tx-k.sx)*e,y=k.sy+(k.ty-k.sy)*e,an=Math.atan2(k.ty-k.sy,k.tx-k.sx),tl=50+q*90;
      const g=ctx.createLinearGradient(x,y,x-Math.cos(an)*tl,y-Math.sin(an)*tl);g.addColorStop(0,'rgba(255,210,140,.95)');g.addColorStop(1,'rgba(255,110,30,0)');
      ctx.strokeStyle=g;ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-Math.cos(an)*tl,y-Math.sin(an)*tl);ctx.stroke();
      ctx.fillStyle='#ffe4b8';ctx.beginPath();ctx.arc(x,y,7,0,6.28);ctx.fill();ctx.fillStyle='#5b4636';ctx.beginPath();ctx.arc(x,y,4.5,0,6.28);ctx.fill()}
    else{const q=(k.t-30)/(k.dur-30);
      const g=ctx.createRadialGradient(k.tx,k.ty,0,k.tx,k.ty,200);g.addColorStop(0,`rgba(255,170,80,${(1-q)*.45})`);g.addColorStop(1,'rgba(255,170,80,0)');ctx.fillStyle=g;ctx.fillRect(k.tx-200,k.ty-200,400,400);
      ctx.strokeStyle=`rgba(240,138,60,${1-q})`;ctx.lineWidth=4*(1-q)+1;ctx.beginPath();ctx.arc(k.tx,k.ty,18+q*150,0,6.28);ctx.stroke()}
    ctx.restore()}
  sparks.forEach(p=>{ctx.globalAlpha=Math.min(1,p.life/30);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,1.9,0,6.28);ctx.fill()});ctx.globalAlpha=1;
}
function idleDown(e){const p=ptr(e),cx=W/2,cy=(topB+botB)/2,R=Math.min(W-48,botB-topB-60)/2;
  if(Math.hypot(p.x-cx,p.y-cy)<R){evoGlow=40;tone('sine',520+Math.random()*200,0,.5,.06);buzz(6)}}
$('bBolt').onclick=()=>trigger('bolt');$('bEngulf').onclick=()=>trigger('engulf');$('bMeteor').onclick=()=>trigger('meteor');$('bKeep').onclick=()=>choose(true);$('bAgain').onclick=again;
function renderAlbum(){const a=(EV&&EV.album)||{};let found=0;
  $('albumGrid').innerHTML=ERAS.map((e,ei)=>`<div class="arow"><span>${L2(e.name)}</span><div>${RARE.map((r,k)=>{const n=a[ei*3+k];if(n)found++;return n?`<i class="orb" style="--c:${r.c};--h:${r.hi}" title="${L2(r.name)}"><b>${num(n)}</b></i>`:'<i class="orb off">?</i>'}).join('')}</div></div>`).join('');
  $('albumCount').textContent=save.lang==='fa'?`${num(found)} از ${num(ERAS.length*RARE.length)}`:`${found} of ${ERAS.length*RARE.length}`}
$('bAlbum').onclick=()=>{ensureAudio();renderAlbum();$('album').hidden=false;$('bAlbum').classList.remove('new')};
$('bAlbumClose').onclick=()=>{$('album').hidden=true};$('album').onclick=e=>{if(e.target.id==='album')$('album').hidden=true};$('bDrop').onclick=()=>choose(false);
document.addEventListener('visibilitychange',()=>{if(!EV)return;if(document.hidden){EV.last=Date.now();persist()}else if(ep===2){growOffline();hud()}});
function resetWorld(){
  atoms=[];bonds=[];reacting.clear();reaction=null;recompute();drag=null;sparks=[];arcs=[];pend=null;phase='idle';morphT=0;strike=null;gambling=false;pops=[];acid=null;acidT=1500;bact=null;bactT=90;sister=null;cyans=[];$('album').hidden=true;$('bBolt').classList.remove('alert');
  if(ep===2){evoInit();setDie(5);resetCoin();dockState()}else populate();
}
function setEpisode(n,card){
  ep=n;save.ep=n;persist();closeMenu();showHint(false);
  ['intro','finale','ep2card'].forEach(id=>$(id).hidden=true);
  applyLang();bounds();resetWorld();hud();
  if(n===2&&card&&!save.evoIntro)$('ep2card').hidden=false;
}

/* ---------- layout ---------- */
function bounds(){
  const b=$('bar').getBoundingClientRect(),tr=$(ep===2?'idock':'tray').getBoundingClientRect();
  topB=b.bottom+8;botB=tr.top-8;
  if(ep===2){const c=$('chance').getBoundingClientRect();if(c.height)topB=Math.max(topB,c.bottom+6)}
  resB=topB+Math.max(56,Math.min(small?96:124,(botB-topB)*.24));buildScene();
}
function resize(){
  const oW=W,oH=H;DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;small=Math.min(W,H)<600;
  const sc=small?1.12:1;for(const k in BASE_R)R[k]=BASE_R[k]*sc;
  cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);bounds();
  if(oW&&oH)atoms.forEach(a=>{a.x*=W/oW;a.y*=H/oH});
}
addEventListener('resize',resize);

/* ---------- menu & wiring ---------- */
let resetArm=false;
const openMenu=()=>{$('menu').hidden=false;hud()};
function closeMenu(){$('menu').hidden=true;resetArm=false;$('reset').textContent=S('reset')}
$('bMenu').onclick=()=>$('menu').hidden?openMenu():closeMenu();
$('bClose').onclick=closeMenu;
$('bHint').onclick=()=>showHint($('hintBox').hidden,false);
$('goal').onclick=()=>showHint($('hintBox').hidden,false);
$('goal').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showHint($('hintBox').hidden,false)}};
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{save.lang=b.dataset.lang;persist();applyLang()});
$('bSound').onclick=()=>{save.sound=!save.sound;persist();ensureAudio();if(master)master.gain.value=save.sound?.8:0;applyLang()};
$('reset').onclick=()=>{if(!resetArm){resetArm=true;$('reset').textContent=S('resetConfirm');return}
  save={done:{},coll:{},finale:false,lang:save.lang,sound:save.sound,ep:1,evo:null};EV=null;persist();setEpisode(1);toast(S('resetDone'))};
document.querySelectorAll('[data-ep]').forEach(b=>b.onclick=()=>{const n=+b.dataset.ep;if(n!==ep)setEpisode(n,true);else closeMenu()});
$('bGo2').onclick=()=>setEpisode(2,true);
$('bStart2').onclick=()=>{ensureAudio();$('ep2card').hidden=true;save.evoIntro=true;persist()};
$('bStart').onclick=()=>{ensureAudio();$('intro').hidden=true;showHint(true,true)};
$('bFree').onclick=()=>{$('finale').hidden=true};
if(save.done.formaldehyde||ep===2)$('intro').hidden=true;

resize();applyLang();bounds();resetWorld();hud();
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;let n=0;while(acc>=16.67&&n<3){try{step()}catch(e){}acc-=16.67;n++}try{render()}catch(e){ctx.setTransform(DPR,0,0,DPR,0,0)}requestAnimationFrame(loop)}
requestAnimationFrame(loop);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(bounds);
})();
